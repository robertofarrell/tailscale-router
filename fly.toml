# The app name is deliberately not set here. CI passes it as `-a` from the
# FLY_APP_NAME repository variable, so a fork doesn't have to commit its own
# app name. Local deploys need `-a <your-app>` for the same reason.
primary_region = "syd"

[build]

# No [http_service] or [[services]]: this machine has no public listeners.
# It advertises the 6PN subnet over the tailnet and answers DNS on fdaa::3,
# both of which are reached privately, so the app gets no public IP.

# tailscaled keeps its node identity in /var/lib/tailscale. Without a volume
# that lives in the container filesystem, so every deploy discarded it and the
# router re-registered as a new node with a new tailnet IP.
[mounts]
  source = "tailscale_state"
  destination = "/var/lib/tailscale"

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "256mb"
