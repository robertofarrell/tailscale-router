name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      # Without this, an unset variable becomes `flyctl deploy -a ""`, which
      # fails much further in with a less obvious message.
      - name: Check FLY_APP_NAME is set
        run: |
          if [ -z "$FLY_APP_NAME" ]; then
            echo "::error::The FLY_APP_NAME repository variable is not set." \
                 "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false keeps this to a single machine. Two subnet routers would
      # both advertise the same 6PN route, and Tailscale would pick between
      # them unpredictably.
      - run: flyctl deploy --remote-only --ha=false -a "$FLY_APP_NAME"
